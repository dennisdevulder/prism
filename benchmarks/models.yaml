# Models the benchmark can run against. Adapter is the dispatch hint — what
# the benchmark needs to know to actually invoke the model. Pricing is per
# million tokens, sourced 2026-04-28.
#
# To add a model: drop an entry here. To run only a subset: pass --models
# to scripts/benchmark.py.

