  # ─── Models known broken on this provider; off by default ────────────────
  - id: kimi-k2-5
    label: Kimi K2.5
    provider: openai
    model_id: kimi-k2.5
    pricing: { input: 0.60, output: 2.40 }
    strict_json: false
    max_tokens: 8192
    disabled: true
    notes: |
      Reasoning model, BROKEN on DO Gradient for inputs >~5K tokens —
      reasoning trace collapses to `!` spam from the first token, content
      always empty. Tiny prompts work fine. Tested 2026-04-29; re-enable
      when DO fixes the serving.
