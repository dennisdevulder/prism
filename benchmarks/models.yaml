# Models the benchmark can run against. Pricing per million tokens.
#
# Models below run via DigitalOcean Gradient Serverless Inference
# (https://inference.do-ai.run/v1) — single OpenAI-compatible endpoint.
# Catalog probed via scripts/probe_models.py on 2026-04-29.
#
# Per-model knobs:
#   strict_json: false     drop response_format=json_object (some models
#                          return empty/parse-error under strict JSON)
#   max_tokens: <n>        widen budget for reasoning models that burn
#                          tokens on internal reasoning before answering
#   disabled: true         skip in the default sweep (--only-models still
#                          forces them; useful for "broken upstream" cases)
#
# To run via DO:
#   export OPENAI_API_KEY=<DO Model Access Key>
#   export OPENAI_BASE_URL=https://inference.do-ai.run/v1
#   python3 scripts/benchmark.py --tiers t1,t2

models:
  # To benchmark a model not in this catalog (a direct Anthropic key, an
  # OpenAI key, a local Ollama instance, your own fine-tune), use:
  #   ./prism bench --model-id <api-id> --label "..." --pricing IN OUT \
  #                 --base-url <url> --api-key <key>
  # Add --save-as <id> to also append the model here for future runs.

  # ─── Open-weight models accessible on DO Gradient (verified 2026-04-29) ───
  - id: deepseek-3-2
    label: DeepSeek 3.2
    provider: openai
    model_id: deepseek-3.2
    pricing: { input: 0.35, output: 1.40 }
    notes: |
      Non-reasoning. Best value/correct in the prior sweep. Fast (~3s/cell).

  - id: glm-5
    label: GLM-5 (z.ai)
    provider: openai
    model_id: glm-5
    pricing: { input: 1.00, output: 3.00 }
    notes: |
      Reasoning model but emitted 1 false-positive in the prior sweep
      (description-mismatch on a clean fixture). Slower than DeepSeek.

  - id: llama-4-maverick
    label: Llama 4 Maverick
    provider: openai
    model_id: llama-4-maverick
    pricing: { input: 1.50, output: 4.50 }
    notes: Meta open-weight flagship; highest accuracy in prior sweep at higher cost

  - id: llama-3-3-70b
    label: Llama 3.3 70B Instruct
    provider: openai
    model_id: llama3.3-70b-instruct
    pricing: { input: 0.59, output: 0.79 }
    notes: Meta previous-gen flagship; pricing is rough public rate

  - id: qwen3-5-397b
    label: Qwen 3.5 397B (MoE)
    provider: openai
    model_id: qwen3.5-397b-a17b
    pricing: { input: 0.80, output: 2.40 }
    strict_json: false
    max_tokens: 8192
    notes: |
      Alibaba flagship MoE (17B active). Reasoning model — needs the
      wider max_tokens and free-form JSON. Verified fixed 2026-04-29.

  - id: qwen3-32b
    label: Qwen 3 32B
    provider: openai
    model_id: alibaba-qwen3-32b
    pricing: { input: 0.40, output: 0.80 }
    strict_json: false
    max_tokens: 8192
    notes: Reasoning; pricing approximate (DeepInfra public rate)

  - id: qwen3-coder-flash
    label: Qwen 3 Coder Flash
    provider: openai
    model_id: qwen3-coder-flash
    pricing: { input: 0.30, output: 0.60 }
    notes: Non-reasoning code-tuned variant; pricing approximate

  - id: deepseek-r1-distill-llama-70b
    label: DeepSeek R1 Distill (Llama 70B)
    provider: openai
    model_id: deepseek-r1-distill-llama-70b
